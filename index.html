  <title>Meine bunte Welt</title>
  <script>
  /* Installationsdialog vor dem Laden der Spiele abfangen. */
  (() => {
    let deferredPrompt = null;
    const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    const isIOS = () => /iPad|iPhone|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = () => /Android/i.test(navigator.userAgent);
    const browser = () => {
      const ua = navigator.userAgent;
      if (/EdgA|EdgiOS/i.test(ua)) return 'Edge';
      if (/FxiOS|Firefox/i.test(ua)) return 'Firefox';
      if (/CriOS|Chrome/i.test(ua)) return 'Chrome';
      if (/Safari/i.test(ua)) return 'Safari';
      return 'Browser';
    };
    function renderInstall() {
      const description = document.getElementById('bw-install-description');
      const button = document.getElementById('bw-install-button');
      const guide = document.getElementById('bw-install-guide');
      if (!description || !button || !guide) return;
      const installed = standalone();
      button.hidden = installed;
      if (installed) {
        description.textContent = 'Bereits installiert: Du verwendest Meine bunte Welt als eigenständige App.';
        guide.textContent = 'Du kannst sie künftig direkt über das App-Symbol auf deinem Home-Bildschirm starten.';
        return;
      }
      const b = browser();
      if (deferredPrompt) {
        description.textContent = 'Dein Browser unterstützt die direkte Installation.';
        button.textContent = 'Jetzt installieren';
      } else {
        description.textContent = 'Die Installation erfolgt über das Menü deines Browsers.';
        button.textContent = 'Installationsanleitung anzeigen';
      }
      if (isIOS()) {
        guide.innerHTML = '<strong>iPhone / iPad:</strong><ol><li>Öffne die Website in Safari.</li><li>Tippe auf das Teilen-Symbol (Quadrat mit Pfeil nach oben) oder in neueren Safari-Versionen auf das Seitenmenü und dann auf „Teilen“.</li><li>Wähle „Zum Home-Bildschirm“ bzw. „Zum Home-Bildschirm hinzufügen“.</li><li>Bestätige mit „Hinzufügen“.</li></ol><p>Falls du einen anderen Browser nutzt, öffne die Seite über dessen Funktion „In Safari öffnen“. Je nach iOS-Version kann der Menüpunkt anders aussehen.</p>';
      } else if (isAndroid()) {
        guide.innerHTML = '<strong>Android (' + b + '):</strong><ol><li>Öffne die Website im Browser.</li><li>Tippe oben rechts auf das Menü mit den drei Punkten (⋮).</li><li>Wähle „App installieren“ oder „Zum Startbildschirm hinzufügen“.</li><li>Bestätige die Installation.</li></ol><p>Wenn „App installieren“ nicht angeboten wird, kann der Browser eventuell nur eine Verknüpfung anlegen.</p>';
      } else {
        guide.innerHTML = '<strong>Computer / anderes Gerät:</strong><ol><li>Öffne die Seite in einem PWA-fähigen Browser (z. B. Chrome oder Edge).</li><li>Suche in der Adressleiste oder im Browsermenü nach „App installieren“.</li><li>Bestätige die Installation.</li></ol>';
      }
    }
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredPrompt = event;
      renderInstall();
    });
    window.addEventListener('appinstalled', () => { deferredPrompt = null; renderInstall(); });
    window.bwSetupInstall = () => {
      renderInstall();
      const button = document.getElementById('bw-install-button');
      if (!button) return;
      button.addEventListener('click', async () => {
        if (!deferredPrompt) {
          const guide = document.getElementById('bw-install-guide');
          if (guide) guide.scrollIntoView({behavior:'smooth', block:'nearest'});
          return;
        }
        const prompt = deferredPrompt;
        deferredPrompt = null;
        try { await prompt.prompt(); await prompt.userChoice; }
        catch (e) { console.info('Installation nicht möglich:', e); }
        renderInstall();
      });
    };
  })();
  </script>

  <script>
  /* Sucht nach Updates, ohne laufende Malbilder automatisch zu schließen. */
  (() => {
    if (!('serviceWorker' in navigator)) return;
    let pending = false, reloading = false;
    let lastInteraction = Date.now();
    ['pointerdown', 'keydown', 'touchstart'].forEach(type =>
      document.addEventListener(type, () => { lastInteraction = Date.now(); }, {passive: true})
    );
    function status(message) {
      const el = document.getElementById('update-status');
      if (el) el.textContent = message;
    }
    async function safeToReload(manual = false) {
      if (!pending || reloading || document.visibilityState !== 'visible') return;
      if (typeof activePage === 'undefined' || !['home','category','parents','gallery'].includes(activePage)) return;
      if (!manual && Date.now() - lastInteraction < 25000) return;
      reloading = true;
      try { await draftWriteQueue; location.reload(); }
      catch { reloading = false; status('Bitte zuerst dein Bild sichern.'); }
    }
    async function checkForUpdates(manual = false) {
      if (!navigator.onLine) { status('Offline – die App sucht wieder, sobald Internet verfügbar ist.'); return; }
      status('Suche nach Updates …');
      try {
        const reg = await navigator.serviceWorker.getRegistration('./');
        if (!reg) { status('Offline-Installation läuft. Bitte gleich erneut prüfen.'); return; }
        await reg.update();
        status(reg.waiting ? 'Update bereit. Schließe alle Fenster der App und öffne sie erneut.' : pending ? 'Update bereit. Zum Übernehmen erneut auf Update prüfen tippen.' : reg.installing ? 'Update wird vollständig heruntergeladen …' : 'Update-Prüfung abgeschlossen.');
        if (pending) safeToReload(manual === true);
      } catch { status('Update-Prüfung nicht möglich. Deine gespeicherte Version bleibt verfügbar.'); }
    }
    window.bwCheckForUpdates = checkForUpdates;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!navigator.serviceWorker.controller) return;
      pending = true;
      status('Update bereit. Es wird außerhalb der Spiele übernommen.');
      safeToReload();
    });
    window.addEventListener('online', checkForUpdates);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { checkForUpdates(); safeToReload(); }
    });
    window.addEventListener('load', () => {
      checkForUpdates();
      setInterval(checkForUpdates, 15 * 60 * 1000);
      setInterval(safeToReload, 5000);
    });
  })();
  </script>

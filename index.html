<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="application-version" content="2.10.2">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F8F7F2">
  <meta name="description" content="Eine liebevolle, werbefreie und offline nutzbare Spiel- und Malwelt für kleine Kinder.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bunte Welt">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=2.10.2">
  <link rel="stylesheet" href="v2.css?v=2.10.2">
  <title>Meine bunte Welt</title>
  <script src="extra.js?v=2.10.2" defer></script>
  <script src="v2.js?v=2.10.2" defer></script>
  <script src="soundboard.js?v=2.10.2" defer></script>
  <script src="app.js?v=2.10.2" defer></script>
</head>
<body>
  <div id="app" role="main"></div>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <script>
  /* Sucht nach Updates, ohne laufende Malbilder automatisch zu schließen. */
  (() => {
    if (!('serviceWorker' in navigator)) return;
    let pending = false, reloading = false;
    let lastInteraction = Date.now();
    ['pointerdown', 'keydown', 'touchstart'].forEach(type =>
      document.addEventListener(type, () => { lastInteraction = Date.now(); }, {passive: true})
    );
    function status(message) {
      const el = document.getElementById('update-status');
      if (el) el.textContent = message;
    }
    async function safeToReload(manual = false) {
      if (!pending || reloading || document.visibilityState !== 'visible') return;
      if (typeof activePage === 'undefined' || !['home','category','parents','gallery'].includes(activePage)) return;
      if (!manual && Date.now() - lastInteraction < 25000) return;
      reloading = true;
      try { await draftWriteQueue; location.reload(); }
      catch { reloading = false; status('Bitte zuerst dein Bild sichern.'); }
    }
    async function checkForUpdates(manual = false) {
      if (!navigator.onLine) { status('Offline – die App sucht wieder, sobald Internet verfügbar ist.'); return; }
      status('Suche nach Updates …');
      try {
        const reg = await navigator.serviceWorker.getRegistration('./');
        if (!reg) { status('Offline-Installation läuft. Bitte gleich erneut prüfen.'); return; }
        await reg.update();
        status(pending ? 'Update bereit. Zum Übernehmen erneut auf Update prüfen tippen.' : reg.installing ? 'Update wird vollständig heruntergeladen …' : 'Update-Prüfung abgeschlossen.');
        if (pending) safeToReload(manual === true);
      } catch { status('Update-Prüfung nicht möglich. Deine gespeicherte Version bleibt verfügbar.'); }
    }
    window.bwCheckForUpdates = checkForUpdates;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!navigator.serviceWorker.controller) return;
      pending = true;
      status('Update bereit. Es wird außerhalb der Spiele übernommen.');
      safeToReload();
    });
    window.addEventListener('online', checkForUpdates);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { checkForUpdates(); safeToReload(); }
    });
    window.addEventListener('load', () => {
      checkForUpdates();
      setInterval(checkForUpdates, 15 * 60 * 1000);
      setInterval(safeToReload, 5000);
    });
  })();
  </script>

</body>
</html>

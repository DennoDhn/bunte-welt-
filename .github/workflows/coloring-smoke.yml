name: Ausmalbilder und iPad-Bilderliste testen
on:
  push:
    paths:
      - 'tests/coloring-smoke.mjs'
      - '.github/workflows/coloring-smoke.yml'
      - 'app.js'
      - 'v2.js'
      - 'malkiste-coloring.js'
      - 'v2.css'
      - 'phone.css'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipad-coloring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright WebKit installieren
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: App lokal starten und automatisierten iPad-Test ausführen
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bunte-welt-http.log 2>&1 &
          sleep 2
          node tests/coloring-smoke.mjs

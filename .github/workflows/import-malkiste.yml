name: Import CC0-Malkiste-Ausmalbilder
on:
  push:
    paths:
      - '.github/workflows/import-malkiste.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Originale CC0-PNGs herunterladen und prüfen
        run: |
          set -euo pipefail
          mkdir -p motifs
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            'https://malkiste.eu/bilder/pferd-fohlen.png' -o motifs/malkiste-pferd-fohlen.png
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            'https://malkiste.eu/bilder/einhorn-regenbogen.png' -o motifs/malkiste-einhorn-regenbogen.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for fn in ('malkiste-pferd-fohlen.png', 'malkiste-einhorn-regenbogen.png'):
              data=Path('motifs',fn).read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n') and len(data)>10000, f'Kein gueltiges PNG: {fn}'
              width,height=struct.unpack('>II',data[16:24])
              assert 400 <= width <= 5000 and 400 <= height <= 5000, f'Unerwartete Groesse: {fn} {width}x{height}'
              print(f'{fn}: {width}x{height}, {len(data)} bytes')
          PY
      - name: Lizenzinformationen sichern
        run: |
          cat > motifs/MALKISTE-CC0.md <<'EOF'
          # Malkiste-Vorlagen
          - Pferd mit Fohlen: https://malkiste.eu/pferde/pferd-fohlen/
          - Einhorn mit Regenbogen: https://malkiste.eu/einhorn/einhorn-regenbogen/
          - Originale: https://malkiste.eu/bilder/pferd-fohlen.png und https://malkiste.eu/bilder/einhorn-regenbogen.png
          - Quelle und Lizenz: https://malkiste.eu/ueber/ — CC0 1.0.
          - Stand: 7. November 2026.
          EOF
      - name: Bilder ins Repository übernehmen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motifs/malkiste-pferd-fohlen.png motifs/malkiste-einhorn-regenbogen.png motifs/MALKISTE-CC0.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add two CC0 Malkiste horse and unicorn coloring sheets'
            git push
          fi
